[package]
name = "plenum-bot"
version = "0.1.0"
edition = "2021"
description = "Plenum protocols in Outline: prepared from a template, agenda items from the chat, decisions and a PDF at the end"

[[bin]]
name = "plenum-bot"
path = "src/main.rs"

[dependencies]
anyhow         = "1"
chrono         = { version = "0.4", features = ["serde"] }
chrono-tz      = "0.10"
genpdf         = "0.2"
mime           = "0.3"
mxbot-common   = { git = "https://github.com/PolynomialDivision/mxbot-common", features = ["calendar", "directory", "markdown"] }
# the protocol into the PDF (pdf.rs)
pulldown-cmark = { version = "0.13", default-features = false }
# The same printpdf as genpdf (its built-in font names; genpdf does not re-export them).
printpdf       = { version = "=0.3.4", default-features = false }
reqwest        = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
tokio          = { version = "1", features = ["full"] }
tracing        = "0.1"
uuid           = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
toml     = "1"
